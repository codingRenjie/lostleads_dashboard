<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老船长 — 战败客户分析</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --warn: #f0c14b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
    .page-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: contain;
      flex-shrink: 0;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }
    .brand-block { min-width: 0; }
    .app-name {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin: 0 0 0.2rem;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0; line-height: 1.25; }
    p.lead { color: var(--muted); margin: 0.85rem 0 1.5rem; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      border: 1px solid rgba(255,255,255,.06);
    }
    label.file-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }
    label.file-btn:hover { filter: brightness(1.08); }
    input[type="file"] { display: none; }
    .meta { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
    .actions { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    button.primary {
      background: var(--ok);
      color: #0a1628;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    a.link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    a.link:hover { text-decoration: underline; }
    #status {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: rgba(0,0,0,.25);
      font-size: 0.88rem;
      white-space: pre-wrap;
      display: none;
    }
    #status.show { display: block; }
    #status.processing { border-left: 3px solid var(--warn); }
    #status.done { border-left: 3px solid var(--ok); }
    #status.err { border-left: 3px solid #f66; }
    ul.files { margin: 0.5rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.82rem; max-height: 140px; overflow: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <img class="brand-logo" src="/logo.png" width="56" height="56" alt="老船长" />
      <div class="brand-block">
        <p class="app-name">老船长</p>
        <h1>战败客户分析</h1>
      </div>
    </header>
    <p class="lead">将当天企微群里导出的音频文件夹上传，老船长将会识别出战败记录并做洞察分析。</p>

    <div class="card">
      <label class="file-btn">
        <input type="file" id="folder" webkitdirectory multiple accept="audio/*,.mp3,.wav,.m4a,.webm,.mp4,.ogg,.flac" />
        选择文件夹
      </label>
      <p class="meta">文件名需含顾问名，建议使用 <code>陈放_01.mp3</code> 形式。日期优先使用浏览器提供的文件修改时间。</p>
      <ul class="files" id="fileList"></ul>
      <div class="actions">
        <button type="button" class="primary" id="submitBtn" disabled>开始处理</button>
        <a class="link" href="/dashboard">打开仪表盘</a>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <script>
    const folderInput = document.getElementById("folder");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const fileList = document.getElementById("fileList");

    let selectedFiles = [];

    function audioFilter(f) {
      const n = (f.name || "").toLowerCase();
      return /\.(mp3|wav|m4a|webm|mp4|mpeg|mpga|oga|ogg|flac)$/i.test(n);
    }

    folderInput.addEventListener("change", () => {
      selectedFiles = Array.from(folderInput.files || []).filter(audioFilter);
      fileList.innerHTML = selectedFiles.length
        ? "<li>" + selectedFiles.length + " 个音频文件</li>" + selectedFiles.slice(0, 8).map(f => "<li>" + (f.webkitRelativePath || f.name) + "</li>").join("") + (selectedFiles.length > 8 ? "<li>…</li>" : "")
        : "";
      submitBtn.disabled = selectedFiles.length === 0;
      statusEl.className = "";
      statusEl.textContent = "";
    });

    function setStatus(cls, text) {
      statusEl.className = "show " + cls;
      statusEl.textContent = text;
    }

    async function pollBatch(id) {
      // 每条约需：ffmpeg + 讯飞分帧 + 1～2 次 Kimi；16 条常远超 10 分钟，故上限约 60 分钟
      const maxTries = 3600;
      for (let i = 0; i < maxTries; i++) {
        const r = await fetch("/api/batches/" + id);
        if (!r.ok) throw new Error("查询批次失败");
        const data = await r.json();
        if (data.status === "complete") {
          let msg =
            "处理完成。战败条数：" +
            data.losses.length +
            "\n语音识别通道：" +
            (data.asr_provider === "iflytek" ? "科大讯飞（IFLYTEK_*）" : "Whisper 兼容（ASR_*）");
          if (data.file_errors && data.file_errors.length) {
            msg +=
              "\n\n以下文件异常（" +
              data.file_errors.length +
              " 个），请对照排查：\n" +
              data.file_errors
                .map(function (e) {
                  return "• " + e.filename + "\n  " + e.message;
                })
                .join("\n");
          }
          msg += "\n\n可前往仪表盘查看表格与图表。";
          setStatus(data.file_errors && data.file_errors.length ? "err" : "done", msg);
          submitBtn.disabled = false;
          return;
        }
        if (data.status === "failed") {
          setStatus("err", "批次失败：" + (data.error_message || "未知错误"));
          submitBtn.disabled = false;
          return;
        }
        const sec = i + 1;
        setStatus(
          "processing",
          "处理中… 状态：" +
            data.status +
            "（已等待 " +
            sec +
            "s，约可等待至 60 分钟）\n" +
            "文件多时每条约 1～3 分钟属正常；请勿关闭本页。"
        );
        await new Promise((x) => setTimeout(x, 1000));
      }
      setStatus(
        "err",
        "本页等待已达 60 分钟上限，已停止轮询。\n" +
          "后台可能仍在处理：请打开「仪表盘」查看批次 #" +
          id +
          " 是否已变为完成；若仍为 processing，可继续等待后刷新仪表盘。"
      );
      submitBtn.disabled = false;
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) return;
      submitBtn.disabled = true;
      setStatus("processing", "正在上传…");
      const fd = new FormData();
      const meta = {};
      selectedFiles.forEach((f) => {
        fd.append("files", f, f.webkitRelativePath || f.name);
        meta[f.webkitRelativePath || f.name] = f.lastModified;
      });
      fd.append("meta", JSON.stringify(meta));

      try {
        const res = await fetch("/api/process", { method: "POST", body: fd });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus("err", body.detail || res.statusText || "上传失败");
          submitBtn.disabled = false;
          return;
        }
        setStatus("processing", "已创建批次 #" + body.batch_id + "，处理中（转写+抽取可能需要数分钟）…");
        await pollBatch(body.batch_id);
      } catch (e) {
        setStatus("err", String(e));
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
