<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老船长 — 战败客户分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="side-rail" aria-label="主导航">
      <a href="/" title="老船长">
        <img class="side-logo" src="/logo.png" width="48" height="48" alt="老船长" />
      </a>
      <nav class="side-nav">
        <a class="active" href="/" title="上传">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V5M8 9l4-4 4 4M5 19h14"/></svg>
          上传
        </a>
        <a href="/dashboard?section=analysis" title="当日分析">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>
          分析
        </a>
        <a href="/dashboard?section=strategy" title="销售策略">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 4.5L19 9l-3.5 3.4.8 4.8L12 15.2 7.7 17.2l.8-4.8L5 9l4.8-1.5L12 3z"/></svg>
          策略
        </a>
        <a href="/dashboard?section=data" title="当日数据">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          数据
        </a>
        <a href="/dashboard?section=history" title="历史数据">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
          历史
        </a>
      </nav>
    </aside>

    <main class="main-panel">
      <div class="topbar">
        <div class="brand-lockup">
          <img src="/logo.png" width="44" height="44" alt="" />
          <div>
            <p class="name">老船长</p>
            <h1>战败客户分析</h1>
          </div>
        </div>
        <div class="top-actions">
          <a class="btn btn-soft" href="/dashboard">打开仪表盘</a>
        </div>
      </div>

      <p class="lead">将当天企微群里导出的音频文件夹上传，老船长将会识别出战败记录并做洞察分析。</p>

      <div class="upload-card">
        <label class="btn btn-primary" style="cursor:pointer;">
          <input type="file" id="folder" webkitdirectory multiple accept="audio/*,.mp3,.wav,.m4a,.webm,.mp4,.ogg,.flac" style="display:none;" />
          选择文件夹
        </label>
        <p class="meta">文件名需含顾问名，建议使用 <code>陈放_01.mp3</code> 形式。日期优先使用浏览器提供的文件修改时间。</p>
        <ul class="files" id="fileList"></ul>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="submitBtn" disabled>开始处理</button>
          <a class="btn btn-soft" href="/dashboard">打开仪表盘</a>
        </div>
        <div id="status"></div>
      </div>
    </main>
  </div>

  <script>
    const folderInput = document.getElementById("folder");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const fileList = document.getElementById("fileList");

    let selectedFiles = [];

    function audioFilter(f) {
      const n = (f.name || "").toLowerCase();
      return /\.(mp3|wav|m4a|webm|mp4|mpeg|mpga|oga|ogg|flac)$/i.test(n);
    }

    folderInput.addEventListener("change", () => {
      selectedFiles = Array.from(folderInput.files || []).filter(audioFilter);
      fileList.innerHTML = selectedFiles.length
        ? "<li>" + selectedFiles.length + " 个音频文件</li>" + selectedFiles.slice(0, 8).map(f => "<li>" + (f.webkitRelativePath || f.name) + "</li>").join("") + (selectedFiles.length > 8 ? "<li>…</li>" : "")
        : "";
      submitBtn.disabled = selectedFiles.length === 0;
      statusEl.className = "";
      statusEl.textContent = "";
    });

    function setStatus(cls, text) {
      statusEl.className = "show " + cls;
      statusEl.textContent = text;
    }

    async function pollBatch(id) {
      const maxTries = 3600;
      for (let i = 0; i < maxTries; i++) {
        const r = await fetch("/api/batches/" + id);
        if (!r.ok) throw new Error("查询批次失败");
        const data = await r.json();
        if (data.status === "complete") {
          let msg =
            "处理完成。战败条数：" +
            data.losses.length +
            "\n语音识别通道：" +
            (data.asr_provider === "iflytek" ? "科大讯飞（IFLYTEK_*）" : "Whisper 兼容（ASR_*）");
          if (data.file_errors && data.file_errors.length) {
            msg +=
              "\n\n以下文件异常（" +
              data.file_errors.length +
              " 个），请对照排查：\n" +
              data.file_errors
                .map(function (e) {
                  return "• " + e.filename + "\n  " + e.message;
                })
                .join("\n");
          }
          msg += "\n\n可前往仪表盘查看表格与图表。";
          setStatus(data.file_errors && data.file_errors.length ? "err" : "done", msg);
          submitBtn.disabled = false;
          return;
        }
        if (data.status === "failed") {
          setStatus("err", "批次失败：" + (data.error_message || "未知错误"));
          submitBtn.disabled = false;
          return;
        }
        const sec = i + 1;
        setStatus(
          "processing",
          "处理中… 状态：" +
            data.status +
            "（已等待 " +
            sec +
            "s，约可等待至 60 分钟）\n" +
            "文件多时每条约 1～3 分钟属正常；请勿关闭本页。"
        );
        await new Promise((x) => setTimeout(x, 1000));
      }
      setStatus(
        "err",
        "本页等待已达 60 分钟上限，已停止轮询。\n" +
          "后台可能仍在处理：请打开「仪表盘」查看批次 #" +
          id +
          " 是否已变为完成；若仍为 processing，可继续等待后刷新仪表盘。"
      );
      submitBtn.disabled = false;
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) return;
      submitBtn.disabled = true;
      setStatus("processing", "正在上传…");
      const fd = new FormData();
      const meta = {};
      selectedFiles.forEach((f) => {
        fd.append("files", f, f.webkitRelativePath || f.name);
        meta[f.webkitRelativePath || f.name] = f.lastModified;
      });
      fd.append("meta", JSON.stringify(meta));

      try {
        const res = await fetch("/api/process", { method: "POST", body: fd });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus("err", body.detail || res.statusText || "上传失败");
          submitBtn.disabled = false;
          return;
        }
        setStatus("processing", "已创建批次 #" + body.batch_id + "，处理中（转写+抽取可能需要数分钟）…");
        await pollBatch(body.batch_id);
      } catch (e) {
        setStatus("err", String(e));
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
